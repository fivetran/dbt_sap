version: 2

models:
  - name: faglflext
    description: >
      General Ledger Totals (FAGLFLEXT) compatibility view — reconstructs the classic SAP FAGLFLEXT
      totals table from ACDOCA, FINSC_LEDGER_REP, and FINSC_LD_CMP. Amounts are aggregated by fiscal
      year and pivoted into 16 period columns (TSL01–TSL16, HSL01–HSL16, KSL01–KSL16, OSL01–OSL16,
      MSL01–MSL16) plus a carry-forward column (*VT). Requires sap_using_acdoca,
      sap_using_finsc_ledger_rep, and sap_using_finsc_ld_cmp to be true.
    columns:
      - name: rclnt
        description: Client (mandant) identifier
      - name: ryear
        description: Fiscal year
      - name: objnr00
        description: Object number segment 00 (reserved; always 0 in S/4HANA)
      - name: objnr01
        description: Object number segment 01 (reserved; always 0 in S/4HANA)
      - name: objnr02
        description: Object number segment 02 (reserved; always 0 in S/4HANA)
      - name: objnr03
        description: Object number segment 03 (reserved; always 0 in S/4HANA)
      - name: objnr04
        description: Object number segment 04 (reserved; always 0 in S/4HANA)
      - name: objnr05
        description: Object number segment 05 (reserved; always 0 in S/4HANA)
      - name: objnr06
        description: Object number segment 06 (reserved; always 0 in S/4HANA)
      - name: objnr07
        description: Object number segment 07 (reserved; always 0 in S/4HANA)
      - name: objnr08
        description: Object number segment 08 (reserved; always 0 in S/4HANA)
      - name: drcrk
        description: Debit/credit indicator
      - name: rpmax
        description: Maximum posting period within the period block (e.g. 016, 032)
      - name: activ
        description: Business transaction type (BTTYPE from ACDOCA)
      - name: rmvct
        description: Movement type for inventory and asset postings
      - name: rtcur
        description: Transaction currency key
      - name: runit
        description: Unit of measure for quantity fields
      - name: awtyp
        description: Reference transaction type (object type of originating document)
      - name: rldnr
        description: Ledger identifier resolved from FINSC_LEDGER_REP
      - name: rrcty
        description: Record type (actual, plan, etc.)
      - name: rvers
        description: Version (always '001' in S/4HANA ACDOCA path)
      - name: logsys
        description: Logical system (source system identifier)
      - name: racct
        description: General ledger account number
      - name: cost_elem
        description: Cost element (populated when CO line item exists, otherwise empty)
      - name: rbukrs
        description: Company code
      - name: rcntr
        description: Cost center
      - name: prctr
        description: Profit center
      - name: rfarea
        description: Functional area
      - name: rbusa
        description: Business area
      - name: kokrs
        description: Controlling area
      - name: segment
        description: Segment for profitability analysis
      - name: scntr
        description: Partner cost center
      - name: pprctr
        description: Partner profit center
      - name: sfarea
        description: Partner functional area
      - name: sbusa
