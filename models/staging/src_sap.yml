version: 2

sources:
  - name: sap
    schema: "{{ var('sap_schema', 'sap') }}"
    database: "{% if target.type != 'spark' %}{{ var('sap_database', target.database) }}{% endif %}"

    loader: fivetran
    config:
      loaded_at_field: _fivetran_synced

    tables:
      - name: acdoca
        identifier: "{{ var('sap_acdoca_identifier', 'acdoca') }}"
        config:
          enabled: "{{ var('sap_using_acdoca', true) }}"
        description: Universal journal entry line items

      - name: finsc_cmp_versnd
        identifier: "{{ var('sap_finsc_cmp_versnd_identifier', 'finsc_cmp_versnd') }}"
        config:
          enabled: "{{ var('sap_using_finsc_cmp_versnd', true) }}"
        description: Financial SCM component version data

      - name: tj01
        identifier: "{{ var('sap_tj01_identifier', 'tj01') }}"
        config:
          enabled: "{{ var('sap_using_tj01', true) }}"
        description: System status

      - name: marc
        identifier: "{{ var('sap_marc_identifier', 'marc') }}"
        config:
          enabled: "{{ var('sap_using_marc', true) }}"
        description: Plant/storage view material master

      - name: mchb
        identifier: "{{ var('sap_mchb_identifier', 'mchb') }}"
        config:
          enabled: "{{ var('sap_using_mchb', true) }}"
        description: Batch stocks

      - name: mchp
        identifier: "{{ var('sap_mchp_identifier', 'mchp') }}"
        config:
          enabled: "{{ var('sap_using_mchp', true) }}"
        description: Batch master (plant level)

      - name: tka01
        identifier: "{{ var('sap_tka01_identifier', 'tka01') }}"
        config:
          enabled: "{{ var('sap_using_tka01', true) }}"
        description: Controlling area

      - name: t000
        identifier: "{{ var('sap_t000_identifier', 't000') }}"
        config:
          enabled: "{{ var('sap_using_t000', true) }}"
        description: Clients

      - name: matdoc
        identifier: "{{ var('sap_matdoc_identifier', 'matdoc') }}"
        config:
          enabled: "{{ var('sap_using_matdoc', true) }}"
        description: Material document header

      - name: matdoc_extract
        identifier: "{{ var('sap_matdoc_extract_identifier', 'matdoc_extract') }}"
        config:
          enabled: "{{ var('sap_using_matdoc_extract', true) }}"
        description: Material document extract data

      - name: sapsll_tunos
        identifier: "{{ var('sap_sapsll_tunos_identifier', '_sapsll_tunos') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_tunos', true) }}"
        description: SAP Special Ledger transaction numbers

      - name: sapsll_maritc
        identifier: "{{ var('sap_sapsll_maritc_identifier', '_sapsll_maritc') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_maritc', true) }}"
        description: SAP Special Ledger material items

      - name: sapsll_nosca
        identifier: "{{ var('sap_sapsll_nosca_identifier', '_sapsll_nosca') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_nosca', true) }}"
        description: SAP Special Ledger non-scalable data

      - name: sapsll_clsnr
        identifier: "{{ var('sap_sapsll_clsnr_identifier', '_sapsll_clsnr') }}"
        config:
          enabled: "{{ var('sap_using__sapsll_clsnr', true) }}"
        description: SAP Special Ledger classification

      - name: finsc_ledger_rep
        identifier: "{{ var('sap_finsc_ledger_rep_identifier', 'finsc_ledger_rep') }}"
        config:
          enabled: "{{ var('sap_using_finsc_ledger_rep', true) }}"
        description: Financial SCM ledger reporting data

      - name: finsc_ld_cmp
        identifier: "{{ var('sap_finsc_ld_cmp_identifier', 'finsc_ld_cmp') }}"
        config:
          enabled: "{{ var('sap_using_finsc_ld_cmp', true) }}"
        description: Financial SCM lead component data

      - name: bkpf
        identifier: "{{ var('sap_bkpf_identifier', 'bkpf') }}"
        config:
          enabled: "{{ var('sap_using_bkpf', true) }}"
        description: Accounting document header

      - name: bsad_bck
        identifier: "{{ var('sap_bsad_bck_identifier', 'bsad_bck') }}"
        config:
          enabled: "{{ var('sap_using_bsad_bck', true) }}"
        description: Secondary index for customers - cleared items

      - name: bsak_bck
        identifier: "{{ var('sap_bsak_bck_identifier', 'bsak_bck') }}"
        config:
          enabled: "{{ var('sap_using_bsak_bck', true) }}"
        description: Secondary index for vendors - cleared items

      - name: bseg
        identifier: "{{ var('sap_bseg_identifier', 'bseg') }}"
        config:
          enabled: "{{ var('sap_using_bseg', true) }}"
