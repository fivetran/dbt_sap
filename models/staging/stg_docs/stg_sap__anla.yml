version: 2

models:
  - name: stg_sap__anla
    description: Asset master data (fixed assets)
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mandt
              - bukrs
              - anln1
              - anln2
    columns:
      - name: mandt
        description: Client
      - name: bukrs
        description: Company code
      - name: anln1
        description: Main asset number
      - name: anln2
        description: Asset subnumber
      - name: ktogr
        description: Account determination group
