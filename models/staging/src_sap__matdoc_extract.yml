version: 2

sources:
  - name: sap
    tables:
      - name: matdoc_extract
        identifier: "{{ var('sap_matdoc_extract_identifier', 'matdoc_extract') }}"
        config:
          enabled: "{{ var('sap_using_matdoc_extract', true) }}"
        description: Material document extract data
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
