version: 2

sources:
  - name: sap
    tables:
      - name: sapsll_maritc
        identifier: "{{ var('sap_sapsll_maritc_identifier', '_sapsll_maritc') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_maritc', true) }}"
        description: SAP Special Ledger material items
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
          - name: mandt
            description: Client
          - name: matnr
            description: Material number
          - name: stcts
            description: Statistical number
          - name: datab
            description: Valid from date
          - name: datbi
            description: Valid to date
          - name: ccngn
            description: Currency number generation
