version: 2

sources:
  - name: sap
    schema: "{{ var('sap_schema', 'sap') }}"
    database: "{% if target.type != 'spark' %}{{ var('sap_database', target.database) }}{% endif %}"

    loader: fivetran
    config:
      loaded_at_field: _fivetran_synced

    tables:
      - name: marc
        identifier: "{{ var('sap_marc_identifier', 'marc') }}"
        config:
          enabled: "{{ var('sap_using_marc', true) }}"
        description: Plant/storage view material master
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
          - name: mandt
            description: Client
          - name: matnr
            description: Material number
          - name: werks
            description: Plant
