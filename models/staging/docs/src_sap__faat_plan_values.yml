version: 2

sources:
  - name: sap
    schema: "{{ var('sap_schema', 'sap') }}"
    database: "{% if target.type != 'spark' %}{{ var('sap_database', target.database) }}{% endif %}"

    loader: fivetran
    config:
      loaded_at_field: _fivetran_synced

    tables:
      - name: faat_plan_values
        identifier: "{{ var('sap_faat_plan_values_identifier', 'faat_plan_values') }}"
        config:
          enabled: "{{ var('sap_using_faat_plan_values', true) }}"
        description: Asset accounting planned periodic values (S/4HANA replacement for ANLP)
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
          - name: mandt
            description: Client
          - name: bukrs
            description: Company code
          - name: anln1
            description: Main asset number
          - name: anln2
            description: Asset subnumber
          - name: gjahr
            description: Fiscal year
          - name: peraf
            description: Fiscal period
          - name: afaber
            description: Depreciation area
          - name: afbnr
            description: Document number for depreciation posting
          - name: zujhr
            description: Year of acquisition
          - name: zucod
            description: Transaction type for acquisitions
          - name: aufwp
            description: Acquisition value for the period
          - name: aufwb
            description: Acquisition value year-to-date
          - name: aufwz
            description: Accumulated acquisition value
          - name: nafap
            description: Ordinary depreciation for the period
          - name: nafag
            description: Ordinary depreciation year-to-date
          - name: nafaz
            description: Accumulated ordinary depreciation
          - name: safap
            description: Special depreciation for the period
          - name: safag
            description: Special depreciation year-to-date
          - name: safaz
            description: Accumulated special depreciation
          - name: aafap
            description: Write-up for the period
          - name: aafag
            description: Write-up year-to-date
          - name: aafaz
            description: Accumulated write-up
          - name: mafap
            description: Manual depreciation for the period
          - name: mafag
            description: Manual depreciation year-to-date
          - name: mafaz
            description: Accumulated manual depreciation
          - name: zinsp
            description: Interest for the period
          - name: zinsg
            description: Interest year-to-date
          - name: zinsz
            description: Accumulated interest
          - name: aufnp
            description: Revaluation for the period
          - name: aufng
            description: Revaluation year-to-date
          - name: aufnz
            description: Accumulated revaluation
          - name: answl
            description: Replacement value at end of year
          - name: invzm
            description: Index measure
          - name: afasl
            description: Depreciation key
          - name: kostl
            description: Cost center
          - name: gsber
            description: Business area
          - name: caufn
            description: Internal order
          - name: xunul
            description: Asset has zero book value
          - name: anupd
            description: Last posting date for depreciation
          - name: fkber
            description: Functional area
          - name: belnr
            description: Accounting document number
          - name: lstar
            description: Activity type
          - name: geber
            description: Fund
          - name: grant_nbr
            description: Grant number
          - name: geber2
            description: Fund 2
          - name: fkber2
            description: Functional area 2
          - name: grant_nbr2
            description: Grant number 2
          - name: fistl2
            description: Funds center 2
          - name: imkey
            description: Investment measure internal key
          - name: ps_psp_pnr2
            description: WBS element 2
          - name: budget_pd
            description: Budget period
          - name: budget_pd2
            description: Budget period 2
          - name: segment
            description: Segment for segmental reporting
          - name: prctr
            description: Profit center
          - name: fistl
            description: Funds center
          - name: zucod
            description: Transaction type for acquisitions
