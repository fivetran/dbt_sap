version: 2

sources:
  - name: sap
    tables:
      - name: sapsll_nosca
        identifier: "{{ var('sap_sapsll_nosca_identifier', '_sapsll_nosca') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_nosca', true) }}"
        description: SAP Special Ledger non-scalable data
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
          - name: stcts
            description: Statistical number
          - name: datab
            description: Valid from date
          - name: datbi
            description: Valid to date
          - name: mandt
            description: Client
          - name: nosct
            description: Number of special cost classification
