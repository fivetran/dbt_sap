version: 2

sources:
  - name: sap
    tables:
      - name: sapsll_tunos
        identifier: "{{ var('sap_sapsll_tunos_identifier', '_sapsll_tunos') }}"
        config:
          enabled: "{{ var('sap_using_sapsll_tunos', true) }}"
        description: SAP Special Ledger transaction numbers
        columns:
          - name: _fivetran_deleted
            description: Fivetran deletion marker
          - name: _fivetran_synced
            description: Fivetran sync timestamp
          - name: mandt
            description: Client
          - name: land1
            description: Country key
          - name: ctsty
            description: Transaction type
          - name: stcts
            description: Statistical number
