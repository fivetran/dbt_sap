version: 0.10.1
bug_fixes:
  - description: Updates the Quickstart table variables for `sap_using_sapsll_clsnr`, `sap_using_sapsll_maritc`, `sap_using_sapsll_nosca`, and `sap_using_sapsll_tunos` in `.quickstart/quickstart.yml` to use the SAP source table names (for example, `/SAPSLL/CLSNR`) instead of the destination names (for example, `_SAPSLL_CLSNR`). Before this fix, Quickstart could not find these tables, set the variables to `false`, and skipped the `marc` model.
