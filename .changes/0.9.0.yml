version: 0.9.0
pr_number: 57
is_breaking: false
schema_data_changes:
  entries:
  - models:
    - '[`bsik`](https://fivetran.github.io/dbt_sap/#!/model/model.sap.bsik)'
    change_type: New Compatibility View
    notes: Vendor Open Items - provides open (uncleared) vendor payables in the classic
      BSIK format, derived from `BSEG` vendor line items joined to `BKPF` headers.
      Complements `bsak` (cleared vendor items) the same way `bsid` complements `bsad`
      for customers. Needs the `BSEG` and `BKPF` tables to run.
  - models:
    - '[`stg_sap__bseg`](https://fivetran.github.io/dbt_sap/#!/model/model.sap.stg_sap__bseg)'
    - '[`stg_sap__bkpf`](https://fivetran.github.io/dbt_sap/#!/model/model.sap.stg_sap__bkpf)'
    change_type: New Columns
    new: '`stg_sap__bseg`: `diekz`, `esrnr`, `kzbtr`, `lnran`, `penfc`, `penlc1`,
      `penlc2`, `penlc3`, `pernr`, `qsznr`, `vorgn`, `zekkn`, `zolld`, `zollt`<br>`stg_sap__bkpf`:
      `penrc`'
    notes: Adds 15 columns already synced from the source but not previously selected,
      so `bsik` can populate them from `BSEG`/`BKPF` instead of hardcoding blanks.
under_the_hood:
- description: Adds a `safe_cast_bigquery` macro (`SAFE_CAST` on BigQuery, plain `cast`
    elsewhere) and uses it for the `hist_tax_factor` columns in `bsad`, `bsak`, `bsid`,
    and `bsik`, replacing the inline logic so the four views stay consistent. Output
    is unchanged on every destination.
date: '2026-10-22'
