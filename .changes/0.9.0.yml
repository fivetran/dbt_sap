    change_type: New Compatibility View
    notes: Vendor Open Items - provides open (uncleared) vendor payables in the classic
      BSIK format, derived from `BSEG` vendor line items joined to `BKPF` headers.
      Complements `bsak` (cleared vendor items) the same way `bsid` complements `bsad`
      for customers. Needs the `BSEG` and `BKPF` tables to run.
